name: Gold Bot Runner
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot.py
      - name: Save state
        run: |
          git config user.name "bot"
          git config user.email "bot@noreply.github.com"
          git add -f state.txt capital_mtf.txt gold_xgb.json gold_rf.pkl gold_cat.cbm accuracy_log.txt last_report.txt 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "auto state" && git push)
